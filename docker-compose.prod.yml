version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AllowedOrigins=${FRONTEND_URL:-http://localhost:3000}
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__SQLite=Data Source=/app/data/stoictrade.db
      - TOTP_SECRET_ENC=${TOTP_SECRET_ENC}
      - MASTER_KEY=${MASTER_KEY}
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379" # Only expose to localhost on the host
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
